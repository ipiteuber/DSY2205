spring.application.name=ms-foro
server.port=8082

# Oracle Autonomous Database en Oracle Cloud, conexion TLS sin wallet.
# En Docker la cadena llega por la variable DB_URL (archivo .env)
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@(description=(retry_count=20)(retry_delay=3)(address=(protocol=tcps)(port=1521)(host=adb.sa-santiago-1.oraclecloud.com))(connect_data=(service_name=CAMBIAR_biblioteca_low.adb.oraclecloud.com))(security=(ssl_server_dn_match=yes)))}
spring.datasource.username=${DB_USER:FORO}
spring.datasource.password=${DB_PASSWORD:Debates#Duoc2026}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Las tablas las crea el script sql/script_foro.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

servicios.usuarios.url=${USUARIOS_URL:http://localhost:8081}

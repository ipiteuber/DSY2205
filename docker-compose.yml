# Levanta los 3 microservicios y el frontend. La cadena de Oracle Cloud se lee del archivo .env
# Las imagenes se publican en Docker Hub (mtduoc17) y la maquina en la nube las descarga desde ahi
services:
  ms-usuarios:
    build: ./ms-usuarios
    image: mtduoc17/foroduoc-ms-usuarios:2.0.0
    container_name: ms-usuarios
    ports:
      - "8081:8081"
    environment:
      DB_URL: ${DB_URL}
      JAVA_TOOL_OPTIONS: -Xmx320m
    restart: unless-stopped

  ms-foro:
    build: ./ms-foro
    image: mtduoc17/foroduoc-ms-foro:2.0.0
    container_name: ms-foro
    ports:
      - "8082:8082"
    environment:
      DB_URL: ${DB_URL}
      USUARIOS_URL: http://ms-usuarios:8081
      JAVA_TOOL_OPTIONS: -Xmx320m
    depends_on:
      - ms-usuarios
    restart: unless-stopped

  ms-moderacion:
    build: ./ms-moderacion
    image: mtduoc17/foroduoc-ms-moderacion:2.0.0
    container_name: ms-moderacion
    ports:
      - "8083:8083"
    environment:
      DB_URL: ${DB_URL}
      USUARIOS_URL: http://ms-usuarios:8081
      FORO_URL: http://ms-foro:8082
      JAVA_TOOL_OPTIONS: -Xmx320m
    depends_on:
      - ms-usuarios
      - ms-foro
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: mtduoc17/foroduoc-frontend:2.0.0
    container_name: foro-frontend
    ports:
      - "80:80"
    restart: unless-stopped

#set( $d = '$' )
spring.application.name=${artifactId}
server.port=${puerto}

# Conexion a Oracle. Se puede cambiar con las variables DB_URL, DB_USER y DB_PASSWORD
spring.datasource.url=${d}{DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${d}{DB_USER:CAMBIAR}
spring.datasource.password=${d}{DB_PASSWORD:CAMBIAR}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Las tablas las crea el script de la carpeta sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

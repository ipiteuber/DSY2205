<div class="checklist mt-2" aria-live="polite">
  <div class="d-flex justify-content-between align-items-center mb-1">
    <small class="fw-semibold">Requisitos de la contraseña</small>
    <small class="text-body-secondary">{{ cumplidas() }}/{{ reglas().length }}</small>
  </div>
  <div class="progress mb-2" role="progressbar" [attr.aria-valuenow]="cumplidas()" aria-valuemin="0" [attr.aria-valuemax]="reglas().length">
    <div class="progress-bar" [class.bg-success]="cumplidas() === reglas().length" [style.width.%]="(cumplidas() / reglas().length) * 100"></div>
  </div>
  <ul class="list-unstyled row g-0 mb-0">
    @for (regla of reglas(); track regla.texto) {
      <li class="col-12 col-sm-6 regla" [class.cumple]="regla.cumple">
        <span class="icono" aria-hidden="true">{{ regla.cumple ? '✓' : '•' }}</span>
        {{ regla.texto }}
      </li>
    }
  </ul>
</div>

<article class="card tema-card h-100" [class.baneado]="tema().estado === 'BANEADO'"
  [style.--color-categoria]="categoria()?.color">
  <div class="card-body d-flex flex-column">
    <div class="d-flex flex-wrap gap-2 align-items-center mb-2">
      @if (mostrarCategoria() && categoria(); as cat) {
        <a class="badge badge-categoria text-decoration-none" [routerLink]="['/categorias', cat.idCategoria]">{{ cat.nombre }}</a>
      }
      @if (tema().estado === 'BANEADO') {
        <span class="badge text-bg-danger">Baneado</span>
      }
    </div>
    <h3 class="h6 card-title mb-2">
      <a class="stretched-link titulo" [routerLink]="['/temas', tema().idTema]">{{ tema().titulo }}</a>
    </h3>
    <p class="card-text small text-body-secondary flex-grow-1">{{ resumen() }}</p>
    <div class="d-flex flex-wrap justify-content-between gap-2 small meta">
      <span>Por <strong>{{ autor() }}</strong> · {{ tema().fechaCreacion | date: 'd MMM y' }}</span>
      <span class="text-nowrap">
        <span title="Visitas">👁 {{ tema().visitas }}</span>
        <span class="ms-2" title="Comentarios">💬 {{ totalComentarios() }}</span>
      </span>
    </div>
  </div>
</article>
